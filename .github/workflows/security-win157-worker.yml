name: Security Windows 157 worker
on:
  workflow_call:
    secrets:
      UPSTREAM_ACTIONS_TOKEN:
        required: false
    inputs:
      stage:
        required: true
        type: number
      operation:
        required: true
        type: string
      source_run:
        type: string
        default: ''
      source_stage:
        type: number
        default: 0
      retain_checkpoint:
        type: boolean
        default: true
    outputs:
      finished:
        value: ${{ jobs.build.outputs.finished }}
      resume_needed:
        value: ${{ jobs.build.outputs.resume_needed }}
      checkpoint_ready:
        value: ${{ jobs.build.outputs.checkpoint_ready }}
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read
    env:
      SECURITY_STAGE: ${{ inputs.stage }}
      SECURITY_OPERATION: ${{ inputs.operation }}
      SECURITY_SOURCE_RUN: ${{ inputs.source_run }}
      SECURITY_SOURCE_STAGE: ${{ inputs.source_stage }}
      CHROMIX_JOBS: auto
    outputs:
      finished: ${{ steps.result.outputs.finished }}
      resume_needed: ${{ steps.result.outputs.resume_needed }}
      checkpoint_ready: ${{ steps.result.outputs.checkpoint_ready }}
    steps:
      - name: Start the total job budget
        shell: pwsh
        run: '"SECURITY_JOB_STARTED=$([DateTimeOffset]::UtcNow.ToString(''o''))" | Add-Content $env:GITHUB_ENV'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-30
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.12.0'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: tools/native-session/go.sum
      - name: Compile shared session acceptance before any large transfer
        shell: pwsh
        working-directory: tools/native-session
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'Shared session dependency cache verification failed' }
          go test -mod=readonly -run '^$' ./...
      - name: Install hash-locked Python tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r build/windows/security-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Hash-locked dependencies failed' }
          "FINGERPRINT_TEST_NODE=$((Get-Command node).Source)" | Add-Content $env:GITHUB_ENV
      - name: Check the private desktop before any large transfer
        shell: pwsh
        run: python -B -X utf8 tools/verify_native_session_runtime.py --host-preflight --report C:/security-evidence/native-session-host-preflight.json
      - name: Lint the current product and retained patch inventories
        shell: pwsh
        run: python -B -X utf8 tools/check_patches.py
      - name: Verify input preservation and existing rendering goldens
        shell: pwsh
        run: python -B -X utf8 -m unittest tools.tests.test_canvas_input_mask tools.tests.test_canvas_audio_candidate tools.tests.test_windows_font_cohorts
      - name: Compile the pinned loopback-only TURN acceptance helper
        shell: pwsh
        run: python -B -X utf8 tools/build_webrtc_turn_fixture.py --output C:/security-evidence/webrtc-turn-fixture.exe
      - name: Verify Windows font cohort evidence cannot accept no-op or partial masking
        shell: pwsh
        run: node --test tools/tests/test_windows_font_acceptance.mjs tools/tests/test_fingerprint_runtime_acceptance.mjs tools/tests/test_font_installation_profiles.mjs
      - name: Stage pinned private font resources without installing system fonts
        shell: pwsh
        run: python -B -X utf8 tools/stage_private_font_packages.py --manifest build/private-font-packages.json --output C:/security-private-font-assets --cache C:/security-private-font-downloads
      - name: Verify real DirectWrite private fonts, stock collection preservation and tamper rejection
        shell: pwsh
        env:
          CHROMIX_PRIVATE_FONT_ASSETS: C:/security-private-font-assets
        run: python -B -X utf8 -m unittest tools.tests.test_private_font_packages.PrivateFontPackagesTest
      - name: Verify document transport acceptance rejects incomplete evidence
        shell: pwsh
        run: python -B -X utf8 -m unittest tools.tests.test_webrtc_document_loopback_acceptance
      - name: Verify the compact product recipe and upgrade rules
        shell: pwsh
        run: python -B -X utf8 -m unittest tools.tests.test_lite_product tools.tests.test_lite_product_migration tools.tests.test_lite_patch_lint tools.tests.test_lite_retirement.RecipeTests tools.tests.test_restoration_rules tools.tests.test_kernel_upgrade_plan tools.tests.test_lite_build_entrypoints tools.tests.test_windows_sdk tools.tests.test_windows_metagen_bindings tools.tests.test_windows157_midl
      - name: Check checkpoint and build-record invariants before any large transfer
        shell: pwsh
        run: python -B -X utf8 -m unittest tools.tests.test_translation_init tools.tests.test_native_history tools.tests.test_native_cookie_source tools.tests.test_native_cookie_runtime tools.tests.test_native_session_runtime tools.tests.test_native_compiled_evidence tools.tests.test_native_integration_candidate tools.tests.test_unaccepted_runtime tools.tests.test_google_services_inputs tools.tests.test_native_browser tools.tests.test_native_environment_controls tools.tests.test_native_browser_acceptance tools.tests.test_native_browser_runtime tools.tests.test_security_build tools.tests.test_security_upstream tools.tests.test_security_candidate tools.tests.test_security_runtime tools.tests.test_security_phases tools.tests.test_security_checkpoint_transfer tools.tests.test_security_migration tools.tests.test_security_handoff tools.tests.test_security_budget_review tools.tests.test_security_run_credentials tools.tests.test_fingerprint_evidence_identity tools.tests.test_security_interstitial_restoration tools.tests.test_enterprise_signal_scope tools.tests.test_windows_etw_resources tools.tests.test_web_package_linkage tools.tests.test_windows_metagen_bindings tools.tests.test_fetch_upstream_cache_arm64
      - name: Admit the donor and download verified source volumes
        id: acquire
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
        run: build/windows/security-stage.ps1 -Phase Acquire -Stage $env:SECURITY_STAGE -Operation $env:SECURITY_OPERATION -SourceRun $env:SECURITY_SOURCE_RUN -SourceStage $env:SECURITY_SOURCE_STAGE
      - name: Extract once and validate the restored source and Ninja state
        id: extract
        if: ${{ steps.acquire.outputs.proceed == 'true' }}
        shell: pwsh
        run: build/windows/security-stage.ps1 -Phase Extract -Stage $env:SECURITY_STAGE -Operation $env:SECURITY_OPERATION -SourceRun $env:SECURITY_SOURCE_RUN -SourceStage $env:SECURITY_SOURCE_STAGE
      - name: Prepare the native SDK and source migration while retaining unchanged timestamps
        id: prepare
        if: ${{ steps.extract.outputs.proceed == 'true' }}
        shell: pwsh
        run: build/windows/security-stage.ps1 -Phase Prepare -Stage $env:SECURITY_STAGE -Operation $env:SECURITY_OPERATION -SourceRun $env:SECURITY_SOURCE_RUN -SourceStage $env:SECURITY_SOURCE_STAGE
      - name: Configure the toolchain and record actual GN arguments and pending work
        id: configure
        if: ${{ steps.prepare.outputs.proceed == 'true' }}
        shell: pwsh
        run: build/windows/security-stage.ps1 -Phase Configure -Stage $env:SECURITY_STAGE -Operation $env:SECURITY_OPERATION -SourceRun $env:SECURITY_SOURCE_RUN -SourceStage $env:SECURITY_SOURCE_STAGE
      - name: Incrementally compile only Ninja's remaining work
        id: compile
        if: ${{ steps.configure.outputs.proceed == 'true' }}
        shell: pwsh
        run: build/windows/security-stage.ps1 -Phase Compile -Stage $env:SECURITY_STAGE -Operation $env:SECURITY_OPERATION -SourceRun $env:SECURITY_SOURCE_RUN -SourceStage $env:SECURITY_SOURCE_STAGE
      - name: Stage the immutable runtime bundle without creating an archive
        id: bundle
        if: ${{ steps.compile.outputs.proceed == 'true' }}
        shell: pwsh
        run: build/windows/security-stage.ps1 -Phase Bundle -Stage $env:SECURITY_STAGE -Operation $env:SECURITY_OPERATION -SourceRun $env:SECURITY_SOURCE_RUN -SourceStage $env:SECURITY_SOURCE_STAGE
      - name: Verify native passkey, security, Google service and fingerprint gates
        id: verify
        if: ${{ steps.bundle.outputs.proceed == 'true' }}
        shell: pwsh
        run: build/windows/security-stage.ps1 -Phase Verify -Stage $env:SECURITY_STAGE -Operation $env:SECURITY_OPERATION -SourceRun $env:SECURITY_SOURCE_RUN -SourceStage $env:SECURITY_SOURCE_STAGE
      - name: Archive the verified runtime once and retain matching receipts
        id: archive
        if: ${{ steps.verify.outputs.proceed == 'true' }}
        shell: pwsh
        run: build/windows/security-stage.ps1 -Phase Archive -Stage $env:SECURITY_STAGE -Operation $env:SECURITY_OPERATION -SourceRun $env:SECURITY_SOURCE_RUN -SourceStage $env:SECURITY_SOURCE_STAGE
      - name: Deliver the accepted candidate
        id: candidate
        if: ${{ !cancelled() && steps.archive.outcome == 'success' && steps.archive.outputs.finished == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win157-x64
          path: |
            C:/c/dist/chromix-win-x64.zip
            C:/c/dist/SHA256SUMS
            C:/c/dist/*.json
            C:/c/dist/native-session-runtime.events.jsonl
            C:/c/dist/native-session-runtime.debug.log
            C:/c/dist/webrtc-document-runtime.debug.log
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Preserve the immutable unaccepted runtime after verification failure
        id: diagnostic
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.verify.outcome == 'failure' }}
        shell: pwsh
        run: build/windows/security-stage.ps1 -Phase Diagnose -Stage $env:SECURITY_STAGE
      - name: Upload failed-verification diagnostics before checkpoint compression
        if: ${{ !cancelled() && steps.diagnostic.outcome == 'success' && steps.diagnostic.outputs.diagnostic == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unaccepted-runtime-s${{ inputs.stage }}
          path: C:/unaccepted-runtime/s${{ inputs.stage }}/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload early failure evidence before checkpoint compression
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win157-early-evidence-s${{ inputs.stage }}
          path: C:/security-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve one complete resumable checkpoint when needed or requested
        id: checkpoint
        if: ${{ !cancelled() && (steps.candidate.outcome != 'success' || inputs.retain_checkpoint) }}
        shell: pwsh
        env:
          SECURITY_STAGE: ${{ inputs.stage }}
        run: build/windows/security-stage.ps1 -Phase Checkpoint -Stage $env:SECURITY_STAGE
      - name: Upload checkpoint volume 1
        id: part1
        if: ${{ !cancelled() && steps.checkpoint.outputs.checkpoint == 'true' && fromJSON(steps.checkpoint.outputs.parts) >= 1 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win157-s${{ inputs.stage }}-part1
          path: C:/security-parts/tree.7z.001
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload checkpoint volume 2
        id: part2
        if: ${{ !cancelled() && steps.checkpoint.outputs.checkpoint == 'true' && fromJSON(steps.checkpoint.outputs.parts) >= 2 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win157-s${{ inputs.stage }}-part2
          path: C:/security-parts/tree.7z.002
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload checkpoint volume 3
        id: part3
        if: ${{ !cancelled() && steps.checkpoint.outputs.checkpoint == 'true' && fromJSON(steps.checkpoint.outputs.parts) >= 3 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win157-s${{ inputs.stage }}-part3
          path: C:/security-parts/tree.7z.003
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload checkpoint volume 4
        id: part4
        if: ${{ !cancelled() && steps.checkpoint.outputs.checkpoint == 'true' && fromJSON(steps.checkpoint.outputs.parts) >= 4 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win157-s${{ inputs.stage }}-part4
          path: C:/security-parts/tree.7z.004
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Commit the manifest only after all volume uploads succeed
        id: manifest
        if: >-
          ${{ !cancelled() && steps.part1.outcome == 'success'
              && (steps.checkpoint.outputs.parts == '1' || steps.part2.outcome == 'success')
              && (fromJSON(steps.checkpoint.outputs.parts) < 3 || steps.part3.outcome == 'success')
              && (fromJSON(steps.checkpoint.outputs.parts) < 4 || steps.part4.outcome == 'success') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win157-checkpoint-s${{ inputs.stage }}
          path: C:/security-parts/checkpoint.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain current-stage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win157-evidence-s${{ inputs.stage }}
          path: C:/security-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Report delivery and safe budget continuation
        id: result
        if: always()
        shell: pwsh
        env:
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          RETAIN_CHECKPOINT: ${{ inputs.retain_checkpoint }}
        run: |
          build/windows/security-stage.ps1 -Phase Result -Stage $env:SECURITY_STAGE
