name: Google services Windows x64
on:
  push:
    branches: [codex/google-services-win155]
    paths:
      - '.github/workflows/build-google-services-win155.yml'
      - '.github/workflows/google-services-win155-worker.yml'
      - 'build/windows/build-google-services.ps1'
      - 'build/windows/ensure-windows-sdk.ps1'
      - 'build/windows/package-win.ps1'
      - 'tools/verify_windows_bundle.py'
      - 'tools/prepare_google_services.py'
      - 'tools/verify_google_services_source.py'
      - 'tools/build_google_services_patch.py'
      - 'tools/tests/test_google_services.py'
      - 'build/google-services-win155.json'
      - 'patches/google-services/**'
  workflow_dispatch:
    inputs:
      resume_run:
        description: 'Previous run to resume; empty selects the latest complete checkpoint, then the pinned upstream cache'
        type: string
        default: ''
concurrency:
  group: google-services-win155-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  build-1:
    uses: ./.github/workflows/google-services-win155-worker.yml
    with:
      stage: 1
      resume_run: ${{ inputs.resume_run || '' }}
    secrets: inherit
  build-2:
    needs: build-1
    if: needs.build-1.outputs.finished != 'true'
    uses: ./.github/workflows/google-services-win155-worker.yml
    with:
      stage: 2
      resume_run: ${{ github.run_id }}
    secrets: inherit
