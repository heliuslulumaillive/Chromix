name: Google services Windows 155 worker
on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      resume_run:
        type: string
        default: ''
    outputs:
      finished:
        value: ${{ jobs.build.outputs.finished }}
    secrets:
      UPSTREAM_ACTIONS_TOKEN:
        required: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read
    outputs:
      finished: ${{ steps.build.outputs.finished }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source restoration inputs before downloading the cache
        shell: pwsh
        run: python -B -X utf8 -m unittest tools.tests.test_google_services
      - name: Install and verify Windows build prerequisites
        shell: pwsh
        run: build/windows/build-google-services.ps1 -Phase Prerequisites
      - name: Restore cache and prepare source
        id: restore
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN }}
          GOOGLE_BUILD_STAGE: ${{ inputs.stage }}
          GOOGLE_RESUME_RUN: ${{ inputs.resume_run }}
        run: build/windows/build-google-services.ps1 -Phase Restore -Stage $env:GOOGLE_BUILD_STAGE -ResumeRun $env:GOOGLE_RESUME_RUN
      - name: Compile and package one Windows x64 candidate
        id: build
        shell: pwsh
        env:
          CHROMIX_JOBS: auto
          GOOGLE_BUILD_STAGE: ${{ inputs.stage }}
        run: build/windows/build-google-services.ps1 -Phase Build -Stage $env:GOOGLE_BUILD_STAGE
      - name: Upload candidate
        if: ${{ !cancelled() && steps.build.outputs.finished == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: google-services-win155-x64
          path: |
            C:/c/dist/chromix-win-x64.zip
            C:/c/dist/SHA256SUMS
            C:/c/dist/google-services-source.json
            C:/c/dist/candidate-smoke.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload concise build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-win155-logs-s${{ inputs.stage }}
          path: |
            C:/c/chromix/google-build-logs/
            C:/c/chromix/google-services-source.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive reusable checkpoint even after a compiler failure
        id: checkpoint
        if: ${{ !cancelled() && steps.restore.outputs.checkpoint_ready == 'true' }}
        shell: pwsh
        env:
          GOOGLE_BUILD_STAGE: ${{ inputs.stage }}
        run: build/windows/build-google-services.ps1 -Phase Checkpoint -Stage $env:GOOGLE_BUILD_STAGE
      - name: Save checkpoint part 1
        id: part1
        if: ${{ !cancelled() && steps.checkpoint.outputs.checkpoint == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: google-win155-tree-s${{ inputs.stage }}-part1
          path: C:/google-parts/tree.7z.001
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Save checkpoint part 2
        id: part2
        if: ${{ !cancelled() && steps.checkpoint.outputs.checkpoint == 'true' && fromJSON(steps.checkpoint.outputs.parts) >= 2 }}
        uses: actions/upload-artifact@v4
        with:
          name: google-win155-tree-s${{ inputs.stage }}-part2
          path: C:/google-parts/tree.7z.002
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Save checkpoint part 3
        id: part3
        if: ${{ !cancelled() && steps.checkpoint.outputs.checkpoint == 'true' && fromJSON(steps.checkpoint.outputs.parts) >= 3 }}
        uses: actions/upload-artifact@v4
        with:
          name: google-win155-tree-s${{ inputs.stage }}-part3
          path: C:/google-parts/tree.7z.003
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Save checkpoint part 4
        id: part4
        if: ${{ !cancelled() && steps.checkpoint.outputs.checkpoint == 'true' && fromJSON(steps.checkpoint.outputs.parts) >= 4 }}
        uses: actions/upload-artifact@v4
        with:
          name: google-win155-tree-s${{ inputs.stage }}-part4
          path: C:/google-parts/tree.7z.004
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Mark checkpoint complete after every volume uploaded
        if: >-
          ${{ !cancelled() && steps.checkpoint.outputs.checkpoint == 'true' &&
              steps.part1.outcome == 'success' &&
              (fromJSON(steps.checkpoint.outputs.parts) < 2 || steps.part2.outcome == 'success') &&
              (fromJSON(steps.checkpoint.outputs.parts) < 3 || steps.part3.outcome == 'success') &&
              (fromJSON(steps.checkpoint.outputs.parts) < 4 || steps.part4.outcome == 'success') }}
        uses: actions/upload-artifact@v4
        with:
          name: google-win155-checkpoint-s${{ inputs.stage }}
          path: C:/google-parts/checkpoint.json
          if-no-files-found: error
          retention-days: 14
      - name: Require a candidate at the end of the final stage
        if: ${{ !cancelled() && inputs.stage >= 2 && steps.build.outcome == 'success' && steps.build.outputs.finished != 'true' }}
        shell: pwsh
        run: throw 'Compile time budget exhausted without a candidate. Resume this run to continue from its uploaded checkpoint.'
