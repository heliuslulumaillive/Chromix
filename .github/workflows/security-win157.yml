name: ShardX Lite Windows 157
on:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.github/workflows/security-win157.yml'
      - '.github/workflows/security-win157-worker.yml'
      - 'build/windows/**'
      - 'build/lite-windows157.json'
      - 'build/windows157-port.json'
      - 'build/checkpoint-migrations.json'
      - 'build/checkpoint-sources/**'
      - 'build/ungoogled-revisions.psd1'
      - 'CHROMIUM_WINDOWS_VERSION'
      - 'UNGOOGLED_WINDOWS_VERSION'
      - 'build/args.windows.gn'
      - 'build/args.security.gn'
      - 'build/*capabilities.json'
      - 'build/security-resources/**'
      - 'build/upstream-cache.json'
      - 'patches/lite-windows157/**'
      - 'patches/lite-win156/retirement-manifest.json'
      - 'tools/lite_patch_stack.py'
      - 'tools/prepare_lite_product.py'
      - 'tools/lite_product_migration.py'
      - 'tools/prepare_restored_build.py'
      - 'tools/repair_windows_midl.py'
      - 'tools/patch_selection.py'
      - 'tools/platform_pins.py'
      - 'tools/build_resources.py'
      - 'tools/apply_restored_patches.py'
      - 'tools/verify_patch_stack.py'
      - 'tools/prepare_google_services.py'
      - 'tools/google_services_inputs.py'
      - 'tools/restored_source_resources.py'
      - 'tools/security_*.py'
      - 'tools/verify_security_runtime.py'
      - 'tools/verify_google_services_*.py'
      - 'tools/write_google_services_build_record.py'
      - 'tools/verify_native_*.py'
      - 'tools/native-session/**'
      - 'tools/webrtc_*'
      - 'tools/verify_webrtc_document_loopback_runtime.py'
      - 'tools/build_webrtc_turn_fixture.py'
      - 'tools/webrtc-loopback-turn/**'
      - 'tools/native_compiled_evidence.py'
      - 'tools/lite_retirement.py'
      - 'tools/build_lite_retirement_patch.py'
      - 'tools/verify_*_source.py'
      - 'tools/tests/fixtures/pixel-semantics-v1/**'
      - 'tools/tests/test_lite_*.py'
      - 'tools/tests/test_security_*.py'
      - 'tools/tests/test_native_*.py'
      - 'tools/tests/test_webrtc_document_loopback_acceptance.py'
      - 'tools/tests/test_windows157_midl.py'
      - 'tools/tests/fixtures/windows157-domain-regex.list'
  workflow_call:
    secrets:
      UPSTREAM_ACTIONS_TOKEN:
        required: false
    inputs:
      operation:
        type: string
        default: fresh
      source_run:
        type: string
        default: ''
      source_stage:
        type: string
        default: '0'
      retain_checkpoint:
        type: boolean
        default: true
      max_stages:
        type: string
        default: '4'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [fresh, resume, upstream, upgrade]
        default: fresh
      source_run:
        type: string
        default: ''
        description: 'Only a completed security-win157 checkpoint run; never a Windows 155 donor'
      source_stage:
        type: string
        default: '0'
        description: 'Exact donor checkpoint stage, or 0 for latest complete'
      retain_checkpoint:
        type: boolean
        default: true
        description: 'Retain one complete source/object checkpoint for a later incremental change'
      max_stages:
        type: choice
        options: ['1', '2', '3', '4']
        default: '4'
permissions:
  contents: read
  actions: read
concurrency:
  group: security-win157-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stage1:
    uses: ./.github/workflows/security-win157-worker.yml
    secrets: inherit
    with:
      stage: 1
      operation: ${{ inputs.operation || 'upstream' }}
      source_run: ${{ inputs.source_run || '' }}
      source_stage: ${{ fromJSON(inputs.source_stage || '0') }}
      retain_checkpoint: ${{ github.event_name == 'push' || inputs.retain_checkpoint }}
  stage2:
    needs: stage1
    if: ${{ always() && !cancelled() && needs.stage1.outputs.resume_needed == 'true' && fromJSON(inputs.max_stages || '4') >= 2 }}
    uses: ./.github/workflows/security-win157-worker.yml
    secrets: inherit
    with:
      stage: 2
      operation: resume
      source_run: ${{ github.run_id }}
      retain_checkpoint: ${{ github.event_name == 'push' || inputs.retain_checkpoint }}
  stage3:
    needs: stage2
    if: ${{ always() && !cancelled() && needs.stage2.outputs.resume_needed == 'true' && fromJSON(inputs.max_stages || '4') >= 3 }}
    uses: ./.github/workflows/security-win157-worker.yml
    secrets: inherit
    with:
      stage: 3
      operation: resume
      source_run: ${{ github.run_id }}
      retain_checkpoint: ${{ github.event_name == 'push' || inputs.retain_checkpoint }}
  stage4:
    needs: stage3
    if: ${{ always() && !cancelled() && needs.stage3.outputs.resume_needed == 'true' && fromJSON(inputs.max_stages || '4') >= 4 }}
    uses: ./.github/workflows/security-win157-worker.yml
    secrets: inherit
    with:
      stage: 4
      operation: resume
      source_run: ${{ github.run_id }}
      retain_checkpoint: ${{ github.event_name == 'push' || inputs.retain_checkpoint }}
  result:
    needs: [stage1, stage2, stage3, stage4]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require an accepted candidate; checkpoints alone are unfinished
        env:
          DELIVERED: ${{ needs.stage1.outputs.finished == 'true' || needs.stage2.outputs.finished == 'true' || needs.stage3.outputs.finished == 'true' || needs.stage4.outputs.finished == 'true' }}
        run: |
          if [ "$DELIVERED" != true ]; then
            echo "No accepted candidate delivered. Inspect the preserved Windows 157 checkpoint and failure evidence."
            exit 1
          fi
