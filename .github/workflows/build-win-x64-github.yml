          recovery-branch: ${{ inputs.resume_source_sha == '4470c3c7435a9f2de203396587c6f57705a8c9d5' && 'build/chromium155-donors-20261011' || inputs.resume_source_sha == '2a55082adb89cb8bac7aa7ab8bb61162b53f4c35' && 'fix/win153-midl-stat-20260920' || inputs.resume_source_sha == 'e5b29c58b44e381924a2dd4bd60f54d01abb9d9c' && 'main' || inputs.resume_source_sha == '30dbab28692793fa311c82ae639186003f3a67d9' && 'fix/issue3-font-resume-20260917' || 'fix/issue3-resource-timing-20260916' }}
          token: ${{ github.token }}
      - name: Download tree from previous stage
        if: ${{ inputs.resume_run_id == '' || inputs.resume_stage != '12' }}
        uses: actions/download-artifact@v4
        with:
          pattern: tree-s11-attempt-${{ needs.build-11.outputs.snapshot_attempt }}-part*
          merge-multiple: true
          path: C:\restore
      - name: Download tree from previous run
        if: ${{ inputs.resume_source_sha == '' && inputs.resume_run_id != '' && inputs.resume_stage == '12' }}
        uses: actions/download-artifact@v4
        with:
          pattern: tree-s${{ inputs.resume_tree_stage != '' && inputs.resume_tree_stage || '11' }}-attempt-${{ inputs.resume_attempt }}-part*
          merge-multiple: true
          path: C:\restore
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Select compile parallelism
        shell: powershell
        run: python tools/build_resources.py --github-env
      - name: Run stage 12
        id: stage
        shell: powershell
        run: build\windows\ci-stage.ps1 -StageIndex 12 -MaxStages 12 -FromArtifact
      - name: Upload restored reuse evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-reuse-win-x64-${{ github.job }}-attempt-${{ github.run_attempt }}
          path: |
            C:\c\chromix\upstream-reuse\baseline.json
            C:\c\chromix\upstream-reuse\result.json
            C:\c\chromix\upstream-cache-preparation.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Ensure build tree snapshot
        if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.upload_parts != 'true' }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\c\chromix | Out-Null
          . build\windows\ci-parts.ps1 -Root C:\c -PartsDir C:\parts -Mode Synced
      - name: Upload tree part 1
        if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tree-s12-attempt-${{ github.run_attempt }}-part1
          path: C:\parts\p1\*
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
      - name: Upload tree part 2
        if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tree-s12-attempt-${{ github.run_attempt }}-part2
          path: C:\parts\p2\*
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
      - name: Upload tree part 3
        if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tree-s12-attempt-${{ github.run_attempt }}-part3
          path: C:\parts\p3\*
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
      - name: Upload tree part 4
        if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tree-s12-attempt-${{ github.run_attempt }}-part4
          path: C:\parts\p4\*
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
      - name: Upload fingerprint diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-win-x64-${{ github.job }}-attempt-${{ github.run_attempt }}
          path: C:\c\chromix\fingerprint-diagnostics\
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload final bundle
        if: steps.stage.outputs.finished == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chromix-win-x64
          path: |
            C:\c\dist\chromix-win-x64.zip
            C:\c\dist\SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  complete:
    name: ensure build finished
    needs: [build-1, build-2, build-3, build-4, build-5, build-6, build-7, build-8, build-9, build-10, build-11, build-12]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Assert some stage reported finished
        run: |
          f="${{ join(needs.*.outputs.finished) }}"
          case "$f" in
            *true*) echo "Build finished; chromix-win-x64 artifact uploaded." ;;
            *) echo "Build did not finish within 12 stages."; exit 1 ;;
          esac
