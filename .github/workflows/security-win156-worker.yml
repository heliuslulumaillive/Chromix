name: Security Windows 156 worker
on:
  workflow_call:
    secrets:
      UPSTREAM_ACTIONS_TOKEN:
        required: false
    inputs:
      stage:
        required: true
        type: number
      operation:
        required: true
        type: string
      source_run:
        type: string
        default: ''
    outputs:
      finished:
        value: ${{ jobs.build.outputs.finished }}
      resume_needed:
        value: ${{ jobs.build.outputs.resume_needed }}
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read
    outputs:
      finished: ${{ steps.result.outputs.finished }}
      resume_needed: ${{ steps.result.outputs.resume_needed }}
    steps:
      - name: Start the total job budget
        shell: pwsh
        run: '"SECURITY_JOB_STARTED=$([DateTimeOffset]::UtcNow.ToString(''o''))" | Add-Content $env:GITHUB_ENV'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-30
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.12.0'
      - name: Install hash-locked Python tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r build/windows/security-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Hash-locked dependencies failed' }
          "FINGERPRINT_TEST_NODE=$((Get-Command node).Source)" | Add-Content $env:GITHUB_ENV
      - name: Check checkpoint and build-record invariants before any large transfer
        shell: pwsh
        run: python -B -X utf8 -m unittest tools.tests.test_security_build tools.tests.test_security_upstream tools.tests.test_security_candidate tools.tests.test_security_runtime tools.tests.test_windows_metagen_bindings tools.tests.test_fetch_upstream_cache_arm64
      - name: Prepare or restore, compile and verify Windows 156
        id: stage
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
          SECURITY_STAGE: ${{ inputs.stage }}
          SECURITY_OPERATION: ${{ inputs.operation }}
          SECURITY_SOURCE_RUN: ${{ inputs.source_run }}
          CHROMIX_JOBS: auto
        run: build/windows/security-stage.ps1 -Stage $env:SECURITY_STAGE -Operation $env:SECURITY_OPERATION -SourceRun $env:SECURITY_SOURCE_RUN
      - name: Deliver the accepted candidate
        id: candidate
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && steps.stage.outputs.finished == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win156-x64
          path: |
            C:/c/dist/chromix-win-x64.zip
            C:/c/dist/SHA256SUMS
            C:/c/dist/*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Preserve unfinished or failed build state; skip giant archive after delivered success
        id: checkpoint
        if: ${{ !cancelled() && steps.candidate.outcome != 'success' }}
        shell: pwsh
        env:
          SECURITY_STAGE: ${{ inputs.stage }}
        run: build/windows/security-stage.ps1 -Phase Checkpoint -Stage $env:SECURITY_STAGE
      - name: Upload checkpoint volume 1
        id: part1
        if: ${{ !cancelled() && steps.checkpoint.outputs.checkpoint == 'true' && fromJSON(steps.checkpoint.outputs.parts) >= 1 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win156-s${{ inputs.stage }}-part1
          path: C:/security-parts/tree.7z.001
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload checkpoint volume 2
        id: part2
        if: ${{ !cancelled() && steps.checkpoint.outputs.checkpoint == 'true' && fromJSON(steps.checkpoint.outputs.parts) >= 2 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win156-s${{ inputs.stage }}-part2
          path: C:/security-parts/tree.7z.002
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload checkpoint volume 3
        id: part3
        if: ${{ !cancelled() && steps.checkpoint.outputs.checkpoint == 'true' && fromJSON(steps.checkpoint.outputs.parts) >= 3 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win156-s${{ inputs.stage }}-part3
          path: C:/security-parts/tree.7z.003
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload checkpoint volume 4
        id: part4
        if: ${{ !cancelled() && steps.checkpoint.outputs.checkpoint == 'true' && fromJSON(steps.checkpoint.outputs.parts) >= 4 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win156-s${{ inputs.stage }}-part4
          path: C:/security-parts/tree.7z.004
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Commit the manifest only after all volume uploads succeed
        id: manifest
        if: >-
          ${{ !cancelled() && steps.part1.outcome == 'success'
              && (steps.checkpoint.outputs.parts == '1' || steps.part2.outcome == 'success')
              && (fromJSON(steps.checkpoint.outputs.parts) < 3 || steps.part3.outcome == 'success')
              && (fromJSON(steps.checkpoint.outputs.parts) < 4 || steps.part4.outcome == 'success') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win156-checkpoint-s${{ inputs.stage }}
          path: C:/security-parts/checkpoint.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain current-stage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-win156-evidence-s${{ inputs.stage }}
          path: C:/security-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Report delivery and safe budget continuation
        id: result
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.stage.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          RESUME_SAFE: ${{ steps.checkpoint.outputs.resume_safe }}
        run: |
          $finished = $env:CANDIDATE_OUTCOME -eq 'success'
          $resume = -not $finished -and $env:BUILD_OUTCOME -eq 'success' -and $env:MANIFEST_OUTCOME -eq 'success' -and $env:RESUME_SAFE -eq 'true'
          "finished=$($finished.ToString().ToLowerInvariant())" | Add-Content $env:GITHUB_OUTPUT
          "resume_needed=$($resume.ToString().ToLowerInvariant())" | Add-Content $env:GITHUB_OUTPUT
