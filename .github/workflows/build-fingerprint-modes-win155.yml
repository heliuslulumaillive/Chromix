name: Fingerprint modes Windows x64
on:
  # Also callable from a registered dispatcher on this same isolated commit;
  # no push trigger or change to the legacy workflow is needed here.
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
      source_run:
        type: string
        required: true
      allow_bootstrap_donor:
        type: boolean
        default: false
      max_stages:
        type: string
        default: '4'
    secrets:
      UPSTREAM_ACTIONS_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      operation:
        description: 'Verify an existing candidate, or explicitly resume a completed checkpoint'
        type: choice
        options: [verify, resume]
        default: verify
      source_run:
        description: 'Run containing the candidate to verify or the complete checkpoint to resume'
        type: string
        required: true
        default: '39396862771'
      allow_bootstrap_donor:
        description: 'Explicitly import pinned Google checkpoint 39396862771 once, in stage 1 only'
        type: boolean
        default: false
      max_stages:
        description: 'Maximum sequential compile segments; completed candidates stop the chain early'
        type: choice
        options: ['1', '2', '3', '4']
        default: '4'
concurrency:
  group: fingerprint-modes-win155-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  verify-candidate:
    if: inputs.operation == 'verify'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select the finished candidate without restoring build sources
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FP_SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRun = $env:FP_SOURCE_RUN
          if ($sourceRun -notmatch '^[0-9]+$' -or $sourceRun -eq $env:GITHUB_RUN_ID) { throw 'Select a different numeric source run ID' }
          $source = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$sourceRun" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the source run' }
          $artifacts = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$sourceRun/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read source artifacts' }
          $candidate = @($artifacts.artifacts | Where-Object { $_.name -eq 'fingerprint-modes-win155-x64' -and -not $_.expired })
          if ($candidate.Count -ne 1) {
            "Source run $sourceRun has no unique completed candidate. No SDK, source checkpoint or compiler was started. If compilation is unfinished, explicitly run operation=resume with its completed checkpoint." | Add-Content $env:GITHUB_STEP_SUMMARY
            throw 'No completed candidate is available; verification never falls back to compilation'
          }
          [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            run_id = [long]$sourceRun
            run_attempt = $source.run_attempt
            head_sha = $source.head_sha
            artifact_id = $candidate[0].id
            artifact_name = $candidate[0].name
            artifact_digest = $candidate[0].digest
            source_url = $source.html_url
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'fingerprint-modes-source-run.json')
          "source_run=$sourceRun" | Add-Content $env:GITHUB_OUTPUT
          "artifact_id=$($candidate[0].id)" | Add-Content $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ steps.source.outputs.source_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fingerprint-modes-candidate
          merge-multiple: true
      - name: Install test drivers only
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r tools/google-services-requirements.txt
      - name: Check candidate selection and source contracts
        shell: pwsh
        run: python -B -X utf8 -m unittest tools.tests.test_google_services tools.tests.test_google_services_pipeline tools.tests.test_fingerprint_build_pipeline
      - name: Verify the original candidate bytes without recompiling or repackaging
        shell: pwsh
        run: >-
          python -B -X utf8 tools/verify_google_services_candidate.py
          --build-variant fingerprint-modes-win155
          --artifact-dir "$env:RUNNER_TEMP/fingerprint-modes-candidate"
          --source-run-json "$env:RUNNER_TEMP/fingerprint-modes-source-run.json"
          --report-dir "$env:RUNNER_TEMP/fingerprint-modes-verification"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-modes-candidate-verification
          path: ${{ runner.temp }}/fingerprint-modes-verification/
          if-no-files-found: ignore
          retention-days: 14
  build-1:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'resume'
    uses: ./.github/workflows/fingerprint-modes-win155-worker.yml
    with:
      stage: 1
      resume_run: ${{ inputs.source_run }}
      allow_bootstrap_donor: ${{ inputs.allow_bootstrap_donor }}
    secrets: inherit
  build-2:
    needs: build-1
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.operation == 'resume' && needs.build-1.outputs.resume_needed == 'true' && fromJSON(inputs.max_stages || '4') >= 2
    uses: ./.github/workflows/fingerprint-modes-win155-worker.yml
    with:
      stage: 2
      resume_run: ${{ needs.build-1.outputs.resume_source }}
    secrets: inherit
  build-3:
    needs: build-2
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.operation == 'resume' && needs.build-2.outputs.resume_needed == 'true' && fromJSON(inputs.max_stages || '4') >= 3
    uses: ./.github/workflows/fingerprint-modes-win155-worker.yml
    with:
      stage: 3
      resume_run: ${{ needs.build-2.outputs.resume_source }}
    secrets: inherit
  build-4:
    needs: build-3
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.operation == 'resume' && needs.build-3.outputs.resume_needed == 'true' && fromJSON(inputs.max_stages || '4') >= 4
    uses: ./.github/workflows/fingerprint-modes-win155-worker.yml
    with:
      stage: 4
      resume_run: ${{ needs.build-3.outputs.resume_source }}
    secrets: inherit
  require-candidate:
    needs: [build-1, build-2, build-3, build-4]
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.operation == 'resume'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report candidate delivery or the preserved recovery source
        shell: pwsh
        env:
          FP_STAGE_RESULTS: ${{ toJSON(needs) }}
        run: |
          $stages = $env:FP_STAGE_RESULTS | ConvertFrom-Json
          $results = @($stages.PSObject.Properties | ForEach-Object { $_.Value })
          if (@($results | Where-Object { $_.outputs.finished -eq 'true' }).Count) {
            'A tested candidate was uploaded; remaining compile segments were skipped.' | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            $recovery = @($results | ForEach-Object { $_.outputs.recovery_source } | Where-Object { $_ }) | Select-Object -Last 1
            throw "No candidate was delivered. Last validated recovery source: $recovery. Inspect a failed stage or explicitly resume that checkpoint; progress is retained."
          }
